# Ficheiro: nginx/ridefriend.conf | Função: reverse proxy + segurança + rate limit (P9)
# Deploy: copiar para /etc/nginx/sites-available/ridefriend.conf, ligar via symlink em
# /etc/nginx/sites-enabled/ridefriend.conf e correr `certbot --nginx -d api.ridefriend.ao`
# para acrescentar a secção SSL automaticamente.

# Rate limit a nível de Nginx — primeira camada antes de chegar ao Express.
limit_req_zone $binary_remote_addr zone=ridefriend_global:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=ridefriend_auth:10m rate=20r/m;

# Compressão para respostas JSON.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types application/json application/javascript text/plain text/css;

server {
    listen 80;
    listen [::]:80;
    server_name api.ridefriend.ao;

    # Permite que o Certbot escreva o desafio HTTP-01.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP → HTTPS (Certbot adiciona a secção 443 abaixo).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ridefriend.ao;

    # Estes paths são preenchidos pelo Certbot ao correr `certbot --nginx`.
    # ssl_certificate /etc/letsencrypt/live/api.ridefriend.ao/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.ridefriend.ao/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Headers de segurança.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 1m;

    # Endpoint público — sem rate limit.
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Auth — rate limit mais apertado.
    location /auth/ {
        limit_req zone=ridefriend_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Restantes rotas.
    location / {
        limit_req zone=ridefriend_global burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/ridefriend.access.log;
    error_log  /var/log/nginx/ridefriend.error.log;
}
